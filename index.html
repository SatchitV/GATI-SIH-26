@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.fade-in{animation:fadeIn .3s ease-out}
.spinner{width:16px;height:16px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.6);backdrop-filter:blur(4px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:12px}
.modal-box{background:#fff;border-radius:18px;box-shadow:0 25px 60px rgba(0,0,0,.2);width:100%;max-height:92vh;overflow-y:auto}
.card{background:#fff;border-radius:14px;border:1px solid #e2e8f0;box-shadow:0 1px 3px rgba(0,0,0,.04);transition:box-shadow .2s}
.card:hover{box-shadow:0 4px 12px rgba(0,0,0,.07)}
.input{width:100%;border:1.5px solid #e2e8f0;border-radius:10px;padding:9px 12px;font-size:13px;color:#0f172a;background:#fff;transition:border .2s;outline:none;font-family:inherit}
.input:focus{border-color:#14b8a6;box-shadow:0 0 0 3px rgba(20,184,166,.1)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;border:none;border-radius:9px;font-weight:600;cursor:pointer;transition:all .15s;font-family:inherit;font-size:13px;padding:8px 16px}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.12)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.btn-p{background:linear-gradient(135deg,#14b8a6,#0d9488);color:#fff}
.btn-b{background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff}
.btn-n{background:#0f172a;color:#fff}
.btn-o{background:#fff;color:#374151;border:1.5px solid #d1d5db}
.btn-d{background:#dc2626;color:#fff}
.btn-a{background:#b45309;color:#fff}
.btn-pr{background:#7e22ce;color:#fff}
.btn-g{background:#059669;color:#fff}
.btn-sm{padding:5px 10px;font-size:11px;border-radius:7px}
.sidebar{position:fixed;left:0;top:56px;bottom:0;width:230px;z-index:300;overflow-y:auto;transition:transform .3s}
.si{width:100%;display:flex;align-items:center;gap:9px;padding:9px 16px;border:none;background:transparent;cursor:pointer;text-align:left;color:rgba(255,255,255,.72);font-size:12.5px;font-weight:500;transition:all .15s;font-family:inherit;border-left:3px solid transparent}
.si:hover{background:rgba(255,255,255,.1);color:#fff}
.si.act{background:rgba(255,255,255,.15);color:#fff;border-left-color:rgba(255,255,255,.9);font-weight:700}
.badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:99px;font-size:10px;font-weight:700;letter-spacing:.03em;white-space:nowrap}
.topbar{position:fixed;top:0;left:0;right:0;z-index:400;background:#fff;border-bottom:1px solid #e2e8f0;height:56px;display:flex;align-items:center;padding:0 14px;gap:8px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.tab{padding:7px 14px;border:none;background:transparent;cursor:pointer;font-size:12px;font-weight:500;color:#64748b;border-bottom:2px solid transparent;transition:all .15s;font-family:inherit}
.tab.act{color:#0d9488;border-bottom-color:#0d9488;font-weight:700}
@media(max-width:768px){
  .sidebar{transform:translateX(-100%)}

  .hm{display:none!important}
  .mm{display:flex!important}
  .rg{grid-template-columns:1fr!important}

    </div>
  );

function CreateCh(){
  const {addCh,setPage}=useApp();
  const [f,setF]=useState({title:'',sector:'Health',problem:'',background:'',outcomes:'',requirements:'',geography:'',budget:'',duration:'',deadline:'',kpis:[{name:'',target:'',weight:'',method:''}]});
  const [done,setDone]=useState(false);
  const addK=()=>setF(x=>({...x,kpis:[...x.kpis,{name:'',target:'',weight:'',method:''}]}));
  const updK=(i,k,v)=>{const ks=[...f.kpis];ks[i]={...ks[i],[k]:v};setF(x=>({...x,kpis:ks}))};
  const submit=st=>{addCh({id:gid('CH'),title:f.title,dept:'Dept. of Public Health',deptId:'D1',sector:f.sector,city:'Mumbai',status:st,budget:Number(f.budget)||0,deadline:f.deadline,pilotDuration:f.duration,problem:f.problem,background:f.background,outcomes:f.outcomes,requirements:f.requirements,geography:f.geography,kpis:f.kpis.filter(k=>k.name).map(k=>({id:gid('K'),...k,weight:Number(k.weight)||0})),proposedDate:new Date().toISOString().split('T')[0],applicants:0,reviews:[]});setDone(true);setTimeout(()=>setPage('challenges'),1500)};
  if(done)return <div className="fade-in" style={{textAlign:'center',padding:'48px 20px'}}><div style={{fontSize:48,marginBottom:12}}>✅</div><h2 style={{fontSize:18,fontWeight:800}}>Challenge Submitted!</h2><p style={{fontSize:13,color:'#64748b',marginTop:4}}>Sent to MSInS for review.</p></div>;
  return <div className="fade-in">
    <h1 style={{fontSize:20,fontWeight:800,letterSpacing:'-.5px',marginBottom:16}}>Create New Challenge</h1>
    <div className="card" style={{padding:16}}>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:10}} className="rg">
        <div><label style={{display:'block',fontSize:11,fontWeight:600,color:'#374151',marginBottom:3}}>Title *</label><input className="input" placeholder="e.g., AI-Powered Monitoring" value={f.title} onChange={e=>setF({...f,title:e.target.value})}/></div>
        <div><label style={{display:'block',fontSize:11,fontWeight:600,color:'#374151',marginBottom:3}}>Sector</label><select className="input" value={f.sector} onChange={e=>setF({...f,sector:e.target.value})}>{Object.keys(SC).map(s=><option key={s}>{s}</option>)}</select></div>
      </div>
      <div style={{marginBottom:10}}><label style={{display:'block',fontSize:11,fontWeight:600,color:'#374151',marginBottom:3}}>Problem Statement *</label><textarea className="input" rows={3} placeholder="Describe the problem..." value={f.problem} onChange={e=>setF({...f,problem:e.target.value})} style={{resize:'vertical'}}/></div>
      <div style={{marginBottom:10}}><label style={{display:'block',fontSize:11,fontWeight:600,color:'#374151',marginBottom:3}}>Expected Outcomes *</label><textarea className="input" rows={2} placeholder="What should be achieved?" value={f.outcomes} onChange={e=>setF({...f,outcomes:e.target.value})} style={{resize:'vertical'}}/></div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:10,marginBottom:10}} className="rg">
        <div><label style={{display:'block',fontSize:11,fontWeight:600,color:'#374151',marginBottom:3}}>Budget (₹) *</label><input className="input" type="number" placeholder="5000000" value={f.budget} onChange={e=>setF({...f,budget:e.target.value})}/></div>
        <div><label style={{display:'block',fontSize:11,fontWeight:600,color:'#374151',marginBottom:3}}>Duration</label><input className="input" placeholder="6 months" value={f.duration} onChange={e=>setF({...f,duration:e.target.value})}/></div>
        <div><label style={{display:'block',fontSize:11,fontWeight:600,color:'#374151',marginBottom:3}}>Deadline</label><input className="input" type="date" value={f.deadline} onChange={e=>setF({...f,deadline:e.target.value})}/></div>
      </div>
      <div style={{marginBottom:12}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:6}}><label style={{fontSize:12,fontWeight:700}}>KPIs</label><button className="btn btn-o btn-sm" onClick={addK}>+ Add KPI</button></div>
        {f.kpis.map((k,i)=><div key={i} style={{display:'grid',gridTemplateColumns:'2fr 1fr 1fr',gap:6,marginBottom:6}} className="rg"><input className="input" placeholder="KPI Name" value={k.name} onChange={e=>updK(i,'name',e.target.value)} style={{fontSize:12,padding:'7px 9px'}}/><input className="input" placeholder="Target" value={k.target} onChange={e=>updK(i,'target',e.target.value)} style={{fontSize:12,padding:'7px 9px'}}/><input className="input" type="number" placeholder="Weight%" value={k.weight} onChange={e=>updK(i,'weight',e.target.value)} style={{fontSize:12,padding:'7px 9px'}}/></div>)}
      </div>
      <div style={{display:'flex',gap:8,justifyContent:'flex-end',borderTop:'1px solid #e2e8f0',paddingTop:12}}>
        <button className="btn btn-o" onClick={()=>submit('draft')}>💾 Save Draft</button>
        <button className="btn btn-p" onClick={()=>submit('under-review')} disabled={!f.title||!f.problem||!f.budget}>📤 Submit for Review</button>
      </div>
    </div>
  </div>;
}

    </div>
    <div className="card" style={{padding:14}}><h3 style={{fontSize:13,fontWeight:700,marginBottom:10}}>Milestone Completion</h3>
      {pils[0]?.milestones?.map((m,i)=><div key={m.id} style={{display:'flex',alignItems:'center',gap:8,padding:'5px 0'}}><span style={{fontSize:11,fontWeight:600,flex:1}}>{m.name}</span><PB v={m.status==='completed'?100:m.status==='in-progress'?60:0} cl={m.status==='completed'?'#10b981':'#3b82f6'} h={6}/><B s={m.status}/></div>)}
    </div>
  </div>;
}

function UsersP(){
  return <div className="fade-in">
    <h1 style={{fontSize:20,fontWeight:800,letterSpacing:'-.5px',marginBottom:16}}>User Management</h1>
    <div className="card" style={{padding:14}}>
      <div style={{overflowX:'auto'}}><table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}><thead><tr style={{borderBottom:'1px solid #e2e8f0'}}><th style={{textAlign:'left',padding:'7px 8px',color:'#64748b',fontWeight:600,fontSize:10}}>User</th><th style={{textAlign:'left',padding:'7px 8px',color:'#64748b',fontWeight:600,fontSize:10}}>Email</th><th style={{textAlign:'left',padding:'7px 8px',color:'#64748b',fontWeight:600,fontSize:10}}>Role</th><th className="hm" style={{textAlign:'left',padding:'7px 8px',color:'#64748b',fontWeight:600,fontSize:10}}>Organization</th></tr></thead><tbody>
        {USERS.map(u=><tr key={u.id} style={{borderBottom:'1px solid #f1f5f9'}}><td style={{padding:'8px',display:'flex',alignItems:'center',gap:6}}><Av name={u.name} sz={24} cl={u.role==='govt'?'#0d9488':u.role==='admin'?'#7e22ce':'#2563eb'}/><span style={{fontWeight:600}}>{u.name}</span></td><td style={{padding:'8px',fontSize:11,color:'#64748b'}}>{u.email}</td><td style={{padding:'8px'}}><B s={u.role==='admin'?'passed':u.role==='govt'?'verified':'open'} l={u.role==='admin'?'MSInS':u.role==='govt'?'Government':'Startup'}/></td><td className="hm" style={{padding:'8px',fontSize:11,color:'#64748b'}}>{u.dept||u.company||'—'}</td></tr>)}
      </tbody></table></div>
    </div>
  </div>;
}

function MyChs(){
  const {chs}=useApp();
  return <div className="fade-in">
    <h1 style={{fontSize:20,fontWeight:800,letterSpacing:'-.5px',marginBottom:16}}>My Challenges</h1>
    {chs.map(c=><div key={c.id} className="card" style={{padding:14,marginBottom:10}}>
      <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:8,flexWrap:'wrap'}}>
        <div style={{flex:1,minWidth:180}}><div style={{display:'flex',gap:5,marginBottom:4}}><B s={c.status}/><span style={{fontSize:9,fontWeight:600,background:(SC[c.sector]||'#94a3b8')+'20',color:SC[c.sector],padding:'2px 6px',borderRadius:4}}>{c.sector}</span></div><h3 style={{fontSize:14,fontWeight:700,marginBottom:2}}>{c.title}</h3><div style={{fontSize:11,color:'#64748b',lineHeight:1.5,marginBottom:4}}>{c.problem?.substring(0,100)}...</div><div style={{display:'flex',gap:8,fontSize:10,color:'#94a3b8',flexWrap:'wrap'}}><span>💰 {inrL(c.budget)}</span><span>📍 {c.city}</span><span>👥 {c.applicants||0} apps</span><span>📐 {c.kpis?.length||0} KPIs</span>{c.deadline&&<span>⏳ {fd(c.deadline)}</span>}</div>
          {c.reviews?.length>0&&<div style={{marginTop:6,background:'#f8fafc',borderRadius:6,padding:6,fontSize:10,color:'#475569'}}><strong>Last review:</strong> {c.reviews[c.reviews.length-1].comment?.substring(0,80)}... ({fd(c.reviews[c.reviews.length-1].date)})</div>}
        </div>
      </div>
    </div>)}
  </div>;
}

function GApps(){
  const {apps}=useApp();
  return <div className="fade-in">
    <h1 style={{fontSize:20,fontWeight:800,letterSpacing:'-.5px',marginBottom:16}}>Applications Received</h1>
    <div style={{display:'flex',flexDirection:'column',gap:8}}>
      {apps.map(a=>{const ch=initChallenges.find(c=>c.id===a.chId);const st=initStartups.find(s=>s.id===a.stId);
        return <div key={a.id} className="card" style={{padding:12}}>
          <div style={{display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
            <Av name={st?.name||'?'} sz={30} cl="#2563eb"/>
            <div style={{flex:1,minWidth:120}}><div style={{fontSize:12,fontWeight:600}}>{st?.name}</div><div style={{fontSize:10,color:'#94a3b8',marginTop:1}}>{ch?.title} · Applied {fd(a.applied)}</div></div>
            <B s={a.status}/>
            {a.scr?.url?.score>0&&<span style={{fontSize:11,fontWeight:700}}>URL: {a.scr.url.score}/100</span>}
          </div>
        </div>})}
    </div>
  </div>;
}

// ============ APP ============
function App(){
  const [authScr,setAuthScr]=useState('landing');
  const [user,setUser]=useState(null);
  const [page,setPage]=useState('dashboard');
  const [sideOpen,setSideOpen]=useState(false);
  const [chs,setChs]=useState(initChallenges);
  const [apps,setApps]=useState(initApps);
  const addCh=ch=>setChs(p=>[...p,ch]);
  const updCh=ch=>setChs(p=>p.map(c=>c.id===ch.id?ch:c));
  const addApp=ap=>setApps(p=>[...p,ap]);

  const handleLogin=u=>{setUser(u);setAuthScr('app');setPage('dashboard')};
  const handleLogout=()=>{setUser(null);setAuthScr('landing')};

  const ctx={user,page,setPage,sideOpen,setSideOpen,notifs:initNotifs,chs,apps,sts:initStartups,cons:initContracts,pils:initPilots,pays:initPayments,addCh,updCh,addApp};

  if(authScr==='landing')return <Landing nav={setAuthScr}/>;
  if(authScr==='login')return <Login onLogin={handleLogin} nav={setAuthScr}/>;
  if(authScr==='signup')return <Signup nav={setAuthScr}/>;
  if(!user)return null;

  const render=()=>{
    if(user.role==='govt'){switch(page){
      case 'dashboard':return <GDash/>;case 'challenges':return <MyChs/>;case 'create':return <CreateCh/>;case 'apps':return <GApps/>;case 'pilots':return <PilsP/>;case 'payments':return <PaysP/>;case 'impact':return <ImpP/>;}}
    if(user.role==='admin'){switch(page){
      case 'dashboard':return <ADash/>;case 'review':return <RevQ/>;case 'published':return <PubP/>;case 'screening':return <ScrP/>;case 'contracts':return <ConP/>;case 'pilots':return <PilsP/>;case 'payments':return <PaysP/>;case 'analytics':return <AnalP/>;case 'audit':return <AuditP/>;case 'users':return <UsersP/>;}}
    if(user.role==='startup'){switch(page){
      case 'dashboard':return <SDash/>;case 'profile':return <ProfP/>;case 'browse':return <Browse/>;case 'apps':return <ScrP/>;case 'contracts':return <ConP/>;case 'pilots':return <PilsP/>;case 'payments':return <PaysP/>;case 'impact':return <ImpP/>;}}
    return <Empty icon="❓" title="Page not found"/>;
  };

  return <Ctx.Provider value={ctx}><Layout user={user} logout={handleLogout}>{render()}</Layout></Ctx.Provider>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
